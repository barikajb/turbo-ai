[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "turbo-ai"
version = "0.4.0"
description = "Local coding assistant: ask, explain and fix code from your terminal or VS Code, powered by Ollama."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "rich>=13.7",
    "prompt_toolkit>=3.0.43",
    "psutil>=5.9",
]
keywords = ["ollama", "llm", "coding-assistant", "cli", "local-ai"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/barikajb/turbo-ai"
Issues = "https://github.com/barikajb/turbo-ai/issues"

[project.scripts]
turbo = "turbo_core.cli:main"

[tool.setuptools]
packages = ["turbo_core"]
